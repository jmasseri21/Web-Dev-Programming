<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="google_clone.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=apps" />
</head>
<body>
    <nav>
        <ul class="top-left">
            <li class="about"><a href="google.com" target="_blank">About</a></li>
            <li class="store"><a href="google.com" target="_blank">Store</a></li>
        </ul>
        <ul class="top-right">
            <li class="gmail"><a href="google.com" target="_blank">Gmail</a></li>
            <li class="images"><a href="google.com" target="_blank">Images</a></li>
            <li><button class="drop-services"><style></style></button></li>
            <li><button class="drop-profile"></button></li>
        </ul>
    </nav>
    <main>
        <div class="google-logo">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQgk_hhNCyWP3a-AwiL1OUgLgQbQ_QCBVNZ5I8J0LnsE-CkVWQ38vByThI&s=10" alt="google logo">
        </div>
        <div class="search-bar">
            <form class="search-form">
                <input type="search" name="q" class="search-input" aria-label="search" autocomplete="off" placeholder="Search Google"></input>
            </form>
        </div>
        <div class="extra-buttons">
            <input class="google-search" type="submit" role="button" value="Google Search" aria-label="Google Search"></input>
            <input class="feeling-lucky" type="submit" role="button" value="I'm Feeling Lucky" aria-label="I'm Feeling Lucky"></input>
        </div>
    </main>
    <footer>
        <ul class="bottom-left">
            <li class="advertising"><a href="google.com" target="_blank">Advertising</a></li>
            <li class="business"><a href="google.com" target="_blank">Business</a></li>
            <li class="how-search-works"><a href="google.com" target="_blank">How Search works</a></li>
        </ul>
        <a href=""
    </footer>
</body>
